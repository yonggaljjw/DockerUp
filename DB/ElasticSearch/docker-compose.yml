services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: es1
    hostname: es1
    restart: unless-stopped

    environment:
      # 단일 노드 개발 환경
      - discovery.type=single-node
      - node.name=es1
      - cluster.name=es-cluster

      # 로컬 개발용 - 인증/HTTPS 비활성화
      - xpack.security.enabled=false

      # 메모리
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

      # Docker/Windows 환경에서 mmap 문제 방지
      - node.store.allow_mmap=false

      # 사용하지 않는 기능 비활성화
      - xpack.ml.enabled=false
      - xpack.watcher.enabled=false

    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "9200:9200"

    volumes:
      - ./es/es1/data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: kibana
    restart: unless-stopped

    environment:
      - ELASTICSEARCH_HOSTS=http://es1:9200
      - SERVER_NAME=kibana

    ports:
      - "5601:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5601/api/status || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s