services:
  qgis-server:
    image: qgis/qgis-server:ltr
    container_name: qgis-server
    ports:
      - "8080:80"
    volumes:
      - ./data:/io/data:ro
    environment:
      # 내부 NGINX를 비활성화하려면 설정 (옵션)
      # SKIP_NGINX: "true"
      # QGIS Server 로그 레벨 조정 예시 (필요 시)
      QGIS_SERVER_LOG_LEVEL: "2"
    restart: unless-stopped

