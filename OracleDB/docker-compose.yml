services:
  oracle-db-free:
    # Oracle Container Registry에서 제공하는 공식 이미지입니다.
    image: container-registry.oracle.com/database/free:latest
    
    # 컨테이너 이름 설정 (선택 사항)
    container_name: oracle-db-free-container
    
    # 환경 변수 설정
    # PDB(Pluggable Database) 이름은 FREEPDB1로 기본 설정됩니다.
    # 비밀번호는 반드시 강력하고 안전한 값으로 변경하세요!
    environment:
      # 시스(SYS), 시스템(SYSTEM), PDB Admin 사용자의 비밀번호
      - ORACLE_PWD=securityveryimportant!
    
    # 포트 매핑: [호스트 포트]:[컨테이너 포트]
    # 호스트의 1521 포트를 컨테이너의 기본 리스너 포트 1521에 연결
    ports:
      - "1521:1521"
    
    # 데이터 영속성을 위한 볼륨 설정
    # 호스트 파일 시스템의 'oracle_db_data' 볼륨에 데이터가 저장됩니다.
    volumes:
      - oracle_db_data:/opt/oracle/oradata
      
    # 컨테이너가 항상 실행되도록 설정 (시스템 재부팅 시에도)
    # 데이터베이스는 시작하는 데 시간이 오래 걸릴 수 있으므로 'unless-stopped'를 사용합니다.
    restart: unless-stopped

# 볼륨 정의
volumes:
  oracle_db_data:
    # 이 볼륨은 호스트에 영구적으로 데이터를 저장합니다.
    driver: local